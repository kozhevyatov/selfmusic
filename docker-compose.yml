name: selfmusic

services:
  app:
    build: .
    image: selfmusic:latest
    container_name: selfmusic
    restart: unless-stopped
    ports:
      - "1332:1332"
    # Раскладка на сервере (пути задаются в .env, его передаёт скрипт деплоя):
    #   /volume2/docker/selfmusic/
    #     app/    — этот репозиторий (код; деплой трогает только его)
    #     data/   — конфиг, ключ, аватарки, кэш (и база, если SQLite)
    #     media/  — личные папки пользователей: <логин>/music, <логин>/books
    #     .env    — пути и настройки этого сервера
    # Без .env (разработка) — папки ./data и ./media рядом с этим файлом.
    volumes:
      - ${DATA_PATH:-./data}:/data
      - ${MEDIA_PATH:-./media}:/uploads

      # Папки с музыкой. Всё, что смонтировано внутрь /music, видно в «обзоре папок» в управлении.
      # :ro — только чтение (загрузка и редактор тегов в такую папку недоступны).
      # Уберите :ro, если хотите загружать музыку в эту папку и править теги.
      # Путь к общей музыке задаётся в .env (MUSIC_DIR=/volume1/music).
      # Пока его нет — подключается пустая папка, контейнер всё равно запустится.
      - ${MUSIC_DIR:-./music}:/music/music:ro
      # Аудиокниги (необязательно): BOOKS_DIR=/volume1/audiobooks в .env.
      # В админке добавьте папку /music/books и выберите тип «Аудиокниги».
      - ${BOOKS_DIR:-./books}:/music/books:ro
      # - /volume1/vinyl:/music/vinyl:ro
      # - /volume1/audiobooks:/music/audiobooks:ro
    environment:
      TZ: Asia/Novosibirsk
      # Мастер первого запуска без токена открывается только из локальной сети.
      # Если настраиваете снаружи (через интернет) — задайте токен в .env (SETUP_TOKEN=…), мастер его спросит.
      SETUP_TOKEN: ${SETUP_TOKEN:-}

      # Лимиты для слабого NAS: одновременных перекодирований ffmpeg и обработки обложек.
      # MAX_TRANSCODES: "12"
      # COVER_WORKERS: "2"

      # База — SQLite (файл в data/) или MariaDB/MySQL, выбирается в мастере.
      # Для MariaDB в другом контейнере добавьте в .env строку DB_NETWORK=db (имя его Docker-сети) —
      # скрипт деплоя подключит docker-compose.mariadb.yml, и хост базы будет виден по имени контейнера.
      # Если указать, шаг выбора БД в мастере пропускается.
      # DATABASE_URL: "mysql+pymysql://selfmusic:ПАРОЛЬ@db:3306/selfmusic?charset=utf8mb4"

      # Секрет для JWT и шифрования паролей приложений. Если не задан — генерируется в /data/secret.key
      # SECRET_KEY: ""

    # Чтобы загруженные файлы принадлежали вашему пользователю DSM, а не root,
    # укажите его uid:gid (узнать: id ИМЯ по SSH). Папки data/ и media/ должны быть доступны ему на запись.
    # user: "1026:100"
